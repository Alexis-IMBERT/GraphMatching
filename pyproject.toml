[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-matching"
dynamic = ["version"]
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10.0"
dependencies = [
    "gdist>=2.1.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.4",
    "networkx>=3.3",
    "nibabel>=3.2.2",
    "notebook>=7.2.0",
    "numpy==1.26.4",
    "pandas>=2.2.2",
    "pillow>=10.3.0",
    "plotly>=5.22.0",
    "POT>=0.9.3",
    "pytest>=8.2.2",
    "scikit-learn>=1.0",
    "scipy==1.13.1",
    "seaborn>=0.13.2",
    "slam>=0.6.1",
    "streamlit>=1.35.0",
    "tqdm>=4.66.4",
    "trimesh>=4.3.2",
]


[tool.hatch.version]
path = "demos/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/demos"]

[dependency-groups]
dev = ["ruff>=0.9.10", "pre-commit"]
